# .markdownlint.yaml (básico e permissivo)
default: true

# Desative regras que costumam ser exageradas ou dar falsos positivos:
MD013: false   # Comprimento máximo de linha
MD029: false   # Prefixo de lista ordenada
MD033: false   # HTML embutido
MD041: false   # Deve começar com título
MD036: false   # Itálico e negrito sem asterisco

# Adicione outras regras que te irritam:
# MD024: false  # Títulos duplicados
# MD034: false  # Uso do caractere de til (~)

# (Deixe ativado se quiser checar links, títulos, etc.)
