name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping"
            exit 0
          fi

      - name: Run Prettier
        run: |
          if [ -f package.json ]; then
            npx prettier --check "**/*.{js,json,md}" --ignore-path .gitignore || true
          fi

      - name: Run Markdown lint
        run: |
          if [ -f package.json ]; then
            npx markdownlint-cli '**/*.md' --ignore node_modules --ignore-path .markdownlintignore || true
          fi
