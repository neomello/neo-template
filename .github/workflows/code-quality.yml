name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for lock file
        id: check-lock
        run: |
          echo "has_package_lock=$(test -f package-lock.json && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Setup Node.js (with cache)
        if: steps.check-lock.outputs.has_package_lock == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: "npm"

      - name: Setup Node.js (without cache)
        if: steps.check-lock.outputs.has_package_lock == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping"
            exit 0
          fi

      - name: Run Prettier
        run: |
          if [ -f package.json ]; then
            npx prettier --check "**/*.{js,json,md}" --ignore-path .gitignore || true
          fi

      - name: Run Markdown lint
        run: |
          if [ -f package.json ]; then
            npx markdownlint-cli '**/*.md' --ignore node_modules --ignore-path .markdownlintignore || true
          fi
