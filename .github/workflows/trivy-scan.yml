name: Container image scan (Trivy)
on:
  push:
    paths:
      - Dockerfile
      - '**/Dockerfile'
      - '.github/workflows/**'
jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for Dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "DOCKERFILE_PATH=." >> $GITHUB_ENV
          elif find . -name Dockerfile -type f | grep -q .; then
            DOCKERFILE_DIR=$(find . -name Dockerfile -type f | head -1 | xargs dirname)
            echo "DOCKERFILE_PATH=$DOCKERFILE_DIR" >> $GITHUB_ENV
          else
            echo "No Dockerfile found in repository"
            exit 0
          fi

      - name: Build image
        run: docker build -t neo-template-scan:latest ${{ env.DOCKERFILE_PATH }}

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.12.0
        with:
          image-ref: neo-template-scan:latest
          format: 'table'
