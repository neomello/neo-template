name: Dependency review
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency review
        uses: github/dependency-review-action@v2
