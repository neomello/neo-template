name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * *' # diário às 09:00 UTC
jobs:
  detect-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for files
        id: check-files
        run: |
          echo "has_package_json=$(test -f package.json && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_requirements=$(test -f requirements.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_pyproject=$(test -f pyproject.toml && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Set up Node (if package.json exists)
        if: steps.check-files.outputs.has_package_json == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Set up Python (if pyproject.toml or requirements.txt exists)
        if: steps.check-files.outputs.has_pyproject == 'true' || steps.check-files.outputs.has_requirements == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies (Node)
        if: steps.check-files.outputs.has_package_json == 'true'
        run: npm ci

      - name: Install dependencies (Python - pip)
        if: steps.check-files.outputs.has_requirements == 'true'
        run: pip install -r requirements.txt

      - name: Install dependencies (Python - poetry)
        if: steps.check-files.outputs.has_pyproject == 'true' && steps.check-files.outputs.has_requirements == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install --no-interaction --no-ansi

      - name: Run lint (Node)
        if: steps.check-files.outputs.has_package_json == 'true'
        run: npm run lint --if-present

      - name: Run tests (Node)
        if: steps.check-files.outputs.has_package_json == 'true'
        run: npm test

      - name: Run tests (Python)
        if: steps.check-files.outputs.has_pyproject == 'true' || steps.check-files.outputs.has_requirements == 'true'
        run: |
          pytest -q || true

      - name: Upload artifacts (tests/logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: ./tests || ./reports || ./coverage || .
