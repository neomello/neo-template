name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for files
        id: check-files
        run: |
          echo "has_package_json=$(test -f package.json && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_requirements=$(test -f requirements.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          echo "has_pyproject=$(test -f pyproject.toml && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        if: steps.check-files.outputs.has_package_json == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Python
        if: steps.check-files.outputs.has_pyproject == 'true' || steps.check-files.outputs.has_requirements == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies (Node)
        if: steps.check-files.outputs.has_package_json == 'true'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install dependencies (Python)
        if: steps.check-files.outputs.has_requirements == 'true'
        run: pip install -r requirements.txt

      - name: Run lint
        if: steps.check-files.outputs.has_package_json == 'true'
        run: npm run lint --if-present || true

      - name: Run tests
        if: steps.check-files.outputs.has_package_json == 'true'
        run: npm test --if-present || true
